<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VibeCodingTarot{% endblock %} v{{ version }} - 塔羅牌占卜網站</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/card-sprite.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap"
        rel="stylesheet">
    {% block head %}{% endblock %}
</head>

<body>
    <div class="container">
        <!-- 頭部 -->
        <header class="header">
            <div class="logo">
                <h1>VibeCodingTarot</h1>
                <p>{% block subtitle %}探索內心的智慧，尋找人生的指引{% endblock %}</p>
            </div>
            {% block nav %}
            <nav class="nav">
                <a href="/" class="nav-link {% if active_page == 'index' %}active{% endif %}">首頁</a>
                <a href="/single-card" class="nav-link {% if active_page == 'single' %}active{% endif %}">單張牌</a>
                <a href="/three-cards" class="nav-link {% if active_page == 'three' %}active{% endif %}">三張牌</a>
                <a href="/celtic-cross" class="nav-link {% if active_page == 'celtic' %}active{% endif %}">凱爾特十字</a>
                <a href="/guide" class="nav-link {% if active_page == 'guide' %}active{% endif %}">占卜指南</a>
                <a href="/history" class="nav-link {% if active_page == 'history' %}active{% endif %}">歷史記錄</a>
            </nav>
            {% endblock %}
        </header>

        <!-- 主要內容 -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

        <!-- 頁腳 -->
        <footer class="footer">
            <p>&copy; 2026 VibeCodingTarot v{{ version }}. 探索內心的智慧，尋找人生的指引。</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/divination.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
